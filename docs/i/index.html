<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open in Sleeps</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background: #FFFCF2; color: #191919; text-align: center; padding: 24px;
    }
    .box {
      max-width: 22rem; padding: 1.5rem 1.25rem;
      background: #fff; border: 3px solid #191919;
      box-shadow: 4px 4px 0 #191919;
    }
    h1 { font-size: 1.4rem; margin: 0 0 0.5rem; letter-spacing: 0.04em; }
    p { margin: 0 0 1.25rem; line-height: 1.35; opacity: 0.8; }
    a.btn {
      display: inline-block; text-decoration: none; color: #191919;
      background: #FFB800; border: 3px solid #191919;
      box-shadow: 4px 4px 0 #191919; padding: 0.65rem 1.1rem;
      font-weight: 800; letter-spacing: 0.06em;
    }
    .muted { margin-top: 1.25rem; font-size: 0.85rem; opacity: 0.65; }
  </style>
  <script>
    (function () {
      var d = new URLSearchParams(location.search).get("d");
      if (!d) return;
      // Hand off to the Sleeps app; if it isn't installed, the buttons below remain.
      location.replace("sleeps://import?d=" + encodeURIComponent(d));
    })();
  </script>
</head>
<body>
  <div class="box">
    <h1>OPEN IN SLEEPS</h1>
    <p>Someone shared a countdown with you. Tap below if the app didn’t open.</p>
    <p>
      <a class="btn" id="open" href="#">OPEN COUNTDOWN</a>
    </p>
    <p class="muted">
      No Sleeps yet?
      <a href="https://iliarafa.github.io/sleeps/">Learn about the app</a>
    </p>
  </div>
  <script>
    (function () {
      var d = new URLSearchParams(location.search).get("d");
      var a = document.getElementById("open");
      if (d && a) a.href = "sleeps://import?d=" + encodeURIComponent(d);
      else if (a) a.href = "https://iliarafa.github.io/sleeps/";
    })();
  </script>
</body>
</html>
