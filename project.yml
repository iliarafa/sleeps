name: Countdown
options:
  bundleIdPrefix: net.csrllc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3DLV25C9VK
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0

packages:
  CountdownKit:
    path: CountdownKit

targets:
  Countdown:
    type: application
    platform: iOS
    sources:
      - Countdown
      - Shared
    dependencies:
      - package: CountdownKit
      - target: CountdownWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.csrllc.countdown
        INFOPLIST_KEY_CFBundleDisplayName: Sleeps
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
    info:
      path: Countdown/Info.plist
      properties:
        CFBundleDisplayName: Sleeps
        CFBundleURLTypes:
          - CFBundleURLName: net.csrllc.countdown
            CFBundleURLSchemes: [sleeps]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Countdown/Countdown.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.csrllc.countdown
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.net.csrllc.countdown

  CountdownWidget:
    type: app-extension
    platform: iOS
    sources:
      - CountdownWidget
      - Shared
    dependencies:
      - package: CountdownKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.csrllc.countdown.widget
        INFOPLIST_KEY_CFBundleDisplayName: Sleeps Widget
    info:
      path: CountdownWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CountdownWidget/CountdownWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.csrllc.countdown

schemes:
  Countdown:
    build:
      targets:
        Countdown: all
    run:
      config: Debug
    archive:
      config: Release
