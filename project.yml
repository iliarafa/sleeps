name: Countdown
options:
  bundleIdPrefix: com.iamilias
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3DLV25C9VK
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0

packages:
  CountdownKit:
    path: CountdownKit

targets:
  Countdown:
    type: application
    platform: iOS
    sources:
      - Countdown
      - Shared
    dependencies:
      - package: CountdownKit
      - target: CountdownWidget
      # Embeds the Watch app, so building this scheme requires the watchOS
      # platform locally: xcodebuild -downloadPlatform watchOS
      - target: CountdownWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamilias.sleeps
        INFOPLIST_KEY_CFBundleDisplayName: Sleeps
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
    info:
      path: Countdown/Info.plist
      properties:
        CFBundleDisplayName: Sleeps
        CFBundleURLTypes:
          - CFBundleURLName: com.iamilias.sleeps
            CFBundleURLSchemes: [sleeps]
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Countdown/Countdown.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.iamilias.sleeps
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.iamilias.sleeps

  CountdownWidget:
    type: app-extension
    platform: iOS
    sources:
      - CountdownWidget
      - Shared
    dependencies:
      - package: CountdownKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamilias.sleeps.widget
        INFOPLIST_KEY_CFBundleDisplayName: Sleeps Widget
    info:
      path: CountdownWidget/Info.plist
      properties:
        CFBundleDisplayName: Sleeps Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CountdownWidget/CountdownWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.iamilias.sleeps

  # Read-only glance. The phone owns the data and pushes it over
  # WatchConnectivity; nothing is created or edited here.
  CountdownWatch:
    type: application
    platform: watchOS
    sources:
      - CountdownWatch
    dependencies:
      - package: CountdownKit
      - target: CountdownWatchWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamilias.sleeps.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: Sleeps
    info:
      path: CountdownWatch/Info.plist
      properties:
        CFBundleDisplayName: Sleeps
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.iamilias.sleeps
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: CountdownWatch/CountdownWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.iamilias.sleeps

  CountdownWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - CountdownWatchWidget
    dependencies:
      - package: CountdownKit
    settings:
      base:
        # NB: was …watchkitapp.complication; that ID is registered to another
        # team on Apple's portal ("not available"), so it can never sign here.
        PRODUCT_BUNDLE_IDENTIFIER: com.iamilias.sleeps.watchkitapp.widget
        INFOPLIST_KEY_CFBundleDisplayName: Sleeps
    info:
      path: CountdownWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Sleeps
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CountdownWatchWidget/CountdownWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.iamilias.sleeps

schemes:
  Countdown:
    build:
      targets:
        Countdown: all
    run:
      config: Debug
    archive:
      config: Release

  CountdownWatch:
    build:
      targets:
        CountdownWatch: all
    run:
      config: Debug
    archive:
      config: Release
